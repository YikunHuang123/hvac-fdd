services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hvac
      POSTGRES_PASSWORD: hvac
      POSTGRES_DB: hvac_fdd
    ports:
      - "5432:5432"
    volumes:
      - hvac-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hvac -d hvac_fdd"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql://hvac:hvac@db:5432/hvac_fdd
      API_HOST: 0.0.0.0
      API_PORT: 8000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro

volumes:
  hvac-postgres-data:
